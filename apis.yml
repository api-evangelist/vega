aid: vega
name: Vega
description: Vega (vega.io) is the operating system for agentic SecOps, a post-SIEM
  security operations platform whose Security Analytics Mesh (SAM) powers AI-native
  federated detection, agentic triage, and analytics on every security data source
  in place, with no ingestion or migration. Founded in 2024 and backed by Cyberstarts,
  Accel, Redpoint, and CRV, Vega raised $120M (announced September 2025) and continuously
  assesses detection coverage against MITRE ATT&CK. The platform is sales-led; its
  application and developer documentation sit behind a customer login.
